# Issue #966 — Flaky-test detection and quarantine workflow
#
# PURPOSE
# -------
# Automatically detects intermittent test failures ("flaky tests") that pass
# sometimes and fail other times, then keeps them visible without blocking
# unrelated PRs.
#
# HOW IT WORKS
# ------------
# 1. Run the test suite twice (parallel jobs: run-1, run-2).
# 2. Compare the two JUnit XML result files.  A test that FAILED in one run
#    but PASSED in the other is flagged as flaky.
# 3. A third job (quarantine-report) collates the flakiness data, appends it
#    to a persistent quarantine registry (uploaded as a workflow artifact),
#    and posts a summary to the GitHub Actions job summary.
# 4. Quarantined tests (marked @pytest.mark.quarantine) are always executed
#    but their failures are recorded, not used to block merges.
#
# QUARANTINE MARKER
# -----------------
# To quarantine a known-flaky test without blocking PRs:
#
#   import pytest
#
#   @pytest.mark.quarantine
#   def test_my_flaky_test():
#       ...
#
# Quarantined tests run in their own step (--quarantine-mode) so their
# failures are visible in CI but never set the overall job exit code to 1.
#
# QUARANTINE REPORT
# -----------------
# The quarantine registry (quarantine_registry.json) is uploaded as an
# artifact and summarised in the Actions job summary after every run.
# A monthly GitHub Actions cron job (see the `quarantine-audit` job below)
# surfaces all tests that have been quarantined for >30 days, prompting a
# human to either fix or intentionally keep them.
#
# TRIGGERS
# --------
# - Every push to main and every pull_request (flaky detection)
# - Monthly (01:00 UTC on the 1st) — quarantine audit / staleness report

name: Flaky-test Detection & Quarantine (Issue #966)

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Monthly quarantine audit — 1st of every month at 01:00 UTC
    - cron: "0 1 1 * *"
  workflow_dispatch:
    inputs:
      reruns:
        description: "Number of repeat runs for flakiness detection"
        default: "2"
        required: false

concurrency:
  group: flaky-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Run 1 — baseline test execution
  # ---------------------------------------------------------------------------
  test-run-1:
    name: Test run 1 of 2 (flaky detection)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests (run 1)
        # Always exit 0 so run-2 still executes even if some tests fail here.
        run: |
          mkdir -p reports/flaky
          pytest -q --timeout=60 \
            -m "not integration and not slow and not quarantine" \
            --junitxml=reports/flaky/run1.xml \
            || true

      - name: Upload run-1 results
        uses: actions/upload-artifact@v4
        with:
          name: flaky-run1-results
          path: reports/flaky/run1.xml
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Run 2 — repeat execution for comparison
  # ---------------------------------------------------------------------------
  test-run-2:
    name: Test run 2 of 2 (flaky detection)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests (run 2)
        run: |
          mkdir -p reports/flaky
          pytest -q --timeout=60 \
            -m "not integration and not slow and not quarantine" \
            --junitxml=reports/flaky/run2.xml \
            || true

      - name: Upload run-2 results
        uses: actions/upload-artifact@v4
        with:
          name: flaky-run2-results
          path: reports/flaky/run2.xml
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Quarantine execution — runs quarantined tests without blocking the build
  # ---------------------------------------------------------------------------
  run-quarantined:
    name: Run quarantined tests (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Always runs (even if main tests fail) so quarantined tests stay visible.
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run quarantined tests (non-blocking)
        # exit 0 regardless of outcome — quarantined tests never block merges.
        run: |
          mkdir -p reports/flaky
          pytest -q --timeout=60 \
            -m "quarantine" \
            --junitxml=reports/flaky/quarantine.xml \
            -v \
            || true
          echo "Quarantined tests completed (failures are non-blocking)."

      - name: Upload quarantine run results
        uses: actions/upload-artifact@v4
        with:
          name: quarantine-run-results
          path: reports/flaky/quarantine.xml
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Flaky detection and quarantine report
  # ---------------------------------------------------------------------------
  quarantine-report:
    name: Flaky detection report
    runs-on: ubuntu-latest
    needs: [test-run-1, test-run-2, run-quarantined]
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download run-1 results
        uses: actions/download-artifact@v4
        with:
          name: flaky-run1-results
          path: reports/flaky/
        continue-on-error: true

      - name: Download run-2 results
        uses: actions/download-artifact@v4
        with:
          name: flaky-run2-results
          path: reports/flaky/
        continue-on-error: true

      - name: Download quarantine run results
        uses: actions/download-artifact@v4
        with:
          name: quarantine-run-results
          path: reports/flaky/
        continue-on-error: true

      - name: Detect flaky tests and build quarantine report
        run: |
          mkdir -p reports/flaky
          python scripts/detect_flaky_tests.py \
            --run1 reports/flaky/run1.xml \
            --run2 reports/flaky/run2.xml \
            --quarantine-xml reports/flaky/quarantine.xml \
            --registry reports/flaky/quarantine_registry.json \
            --output reports/flaky/flaky_report.json \
            || true

      - name: Post quarantine report to job summary
        if: always()
        run: |
          {
            echo "## Flaky-test Detection Report (Issue #966)"
            echo ""
            if [ -f reports/flaky/flaky_report.json ]; then
              python - <<'EOF'
          import json, sys
          from pathlib import Path

          report_path = Path("reports/flaky/flaky_report.json")
          if not report_path.exists():
              print("No flaky report generated.")
              sys.exit(0)

          report = json.loads(report_path.read_text())

          newly_flaky = report.get("newly_detected_flaky", [])
          quarantined = report.get("currently_quarantined", [])
          quarantine_failures = report.get("quarantine_run_failures", [])

          print(f"**Newly detected flaky tests:** {len(newly_flaky)}")
          print(f"**Currently quarantined tests:** {len(quarantined)}")
          print(f"**Quarantine run failures (non-blocking):** {len(quarantine_failures)}")
          print("")

          if newly_flaky:
              print("### ⚠️ Newly Detected Flaky Tests")
              print("These tests passed in one run but failed in another:")
              print("")
              for t in newly_flaky:
                  print(f"- `{t['test_id']}` — failed in run {t.get('failed_run', '?')}")
              print("")
              print("**Action:** Mark with `@pytest.mark.quarantine` and open a tracking issue.")
              print("")

          if quarantined:
              print("### 🔒 Currently Quarantined Tests")
              print("These tests run but their failures do not block merges:")
              print("")
              for t in quarantined:
                  since = t.get("quarantined_since", "unknown date")
                  print(f"- `{t['test_id']}` (since {since})")
              print("")

          if quarantine_failures:
              print("### 🔴 Quarantine Run Failures")
              print("These quarantined tests failed in this run (non-blocking):")
              for t in quarantine_failures:
                  print(f"- `{t}`")
          EOF
            else
              echo "No flaky report found. Results may still be uploading."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload quarantine registry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quarantine-registry
          path: reports/flaky/quarantine_registry.json
          retention-days: 90

      - name: Upload full flaky report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flaky-detection-report
          path: reports/flaky/flaky_report.json
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Monthly quarantine audit — surfaces stale quarantined tests
  # ---------------------------------------------------------------------------
  quarantine-audit:
    name: Monthly quarantine audit (staleness check)
    runs-on: ubuntu-latest
    # Only runs on the monthly schedule trigger
    if: github.event_name == 'schedule'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run quarantine staleness audit
        run: |
          python scripts/detect_flaky_tests.py \
            --audit-only \
            --registry reports/flaky/quarantine_registry.json \
            --stale-days 30 \
            || true

      - name: Post audit summary
        if: always()
        run: |
          {
            echo "## Monthly Quarantine Audit"
            echo ""
            echo "Tests quarantined for more than 30 days require attention:"
            echo "either fix the test or document why it remains quarantined."
            echo ""
            python scripts/detect_flaky_tests.py \
              --audit-only \
              --registry reports/flaky/quarantine_registry.json \
              --stale-days 30 \
              2>&1 || echo "No registry found or audit error."
          } >> "$GITHUB_STEP_SUMMARY"
