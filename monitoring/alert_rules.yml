groups:
  # ---------------------------------------------------------------------------
  # Capacity planning recording rules (Issue #242)
  #
  # These rules pre-compute linear-regression projections so the
  # capacity_planning Grafana dashboard can query a single metric rather than
  # an expensive PromQL expression on every panel refresh.
  #
  # Requirements:
  #   - ledgerlens_cpu_usage_ratio must have at least 7 days (168h) of history
  #     before these values are meaningful.
  #   - Projections assume linear growth; step-change events (e.g. a new
  #     exchange listing) will temporarily invalidate the forecast.  The
  #     confidence-interval band (±1.96σ) widens in the days following a spike,
  #     providing a natural signal to operators that the trend line is unreliable.
  # ---------------------------------------------------------------------------
  - name: ledgerlens_capacity_planning
    interval: 5m
    rules:
      # Linear-regression slope of CPU usage over the last 7 days (per second).
      # deriv() fits a least-squares line to the range vector.
      - record: ledgerlens:cpu_usage_trend_slope
        expr: deriv(avg_over_time(ledgerlens_cpu_usage_ratio[7d]))

      # Estimated days until average CPU usage reaches the 80% alert threshold.
      # Formula: days = (0.8 - current) / slope_per_second / 86400
      # clamp_min prevents division-by-zero when CPU is flat or declining;
      # the result is clamped to [0, 365] to avoid misleading very-large values.
      - record: ledgerlens:capacity_days_to_80pct_cpu
        expr: |
          clamp(
            (0.8 - avg(ledgerlens_cpu_usage_ratio))
              / clamp_min(deriv(avg_over_time(ledgerlens_cpu_usage_ratio[7d])), 1e-10)
              / 86400,
            0, 365
          )

      # 95% confidence interval half-width on the CPU projection.
      # Uses the 7-day rolling standard deviation as a proxy for regression
      # residual spread.  The actual CI shown in the dashboard is ±1.96 * this.
      - record: ledgerlens:cpu_projection_ci_halfwidth
        expr: 1.96 * stddev_over_time(ledgerlens_cpu_usage_ratio[7d])

  - name: ledgerlens_per_pair_health
    interval: 1m
    rules:
      # Fires when a pair's composite health score falls below 0.7 for 30 minutes.
      # Formula: 40% latency health + 40% Benford MAD health + 20% FP-rate health.
      # Score = 1.0 means healthy; 0.0 means completely degraded.
      - alert: PairHealthScoreLow
        expr: |
          (
            (1 - clamp_max(
              histogram_quantile(0.95,
                sum(rate(ledgerlens_score_duration_seconds_bucket[5m])) by (le, asset_pair)
              ) / 0.5,
            1)) * 0.4
            +
            (1 - clamp_max(ledgerlens_benford_mad_gauge / 0.03, 1)) * 0.4
            +
            (1 - clamp_max(
              sum(rate(ledgerlens_benford_computation_total{status="false_positive"}[10m])) by (asset_pair)
              / (sum(rate(ledgerlens_benford_computation_total{status="alert_confirmed"}[10m])) by (asset_pair) + 0.001),
            1)) * 0.2
          ) < 0.7
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Per-pair health score below threshold for {{ $labels.asset_pair }}"
          description: >
            The composite health score for asset pair {{ $labels.asset_pair }} has been
            below 0.7 for more than 30 minutes (current value: {{ $value | printf "%.2f" }}).
            Check scoring latency, Benford MAD freshness, and false-positive rate for this pair.

      # Fires when scoring latency p95 exceeds 500ms for a pair for 10 minutes.
      - alert: PairScoringLatencyHigh
        expr: |
          histogram_quantile(0.95,
            sum(rate(ledgerlens_score_duration_seconds_bucket[5m])) by (le, asset_pair)
          ) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High scoring latency for {{ $labels.asset_pair }}"
          description: >
            p95 scoring latency for {{ $labels.asset_pair }} has exceeded 500ms for 10 minutes
            (current p95: {{ $value | printf "%.3f" }}s).

      # Fires when Benford MAD exceeds non-conformity threshold for a pair.
      - alert: PairBenfordNonConforming
        expr: ledgerlens_benford_mad_gauge > 0.015
        for: 15m
        labels:
          severity: info
        annotations:
          summary: "Benford MAD non-conformity for {{ $labels.asset_pair }}"
          description: >
            Benford MAD for {{ $labels.asset_pair }} has been above the 0.015 non-conformity
            threshold for 15 minutes (current MAD: {{ $value | printf "%.4f" }}).
            This may indicate sustained wash-trading activity or a data quality issue.

  # SLO dashboard alerting rules (issue #197)
  - name: ledgerlens_slo_monitoring
    interval: 1m
    rules:
      # Fires when p99 scoring latency exceeds 5 seconds for 10 minutes.
      # SLO target: p99 < 5s (fraud investigation use case, not real-time blocking).
      - alert: ScoringLatencyP99High
        expr: |
          histogram_quantile(0.99,
            sum(rate(ledgerlens_score_duration_seconds_bucket[5m])) by (le, asset_pair)
          ) > 5.0
        for: 10m
        labels:
          severity: critical
          slo: "latency"
        annotations:
          summary: "Scoring latency p99 exceeds 5s for {{ $labels.asset_pair }}"
          description: >
            p99 scoring latency for {{ $labels.asset_pair }} has exceeded 5 seconds for 10 minutes
            (current p99: {{ $value | printf "%.3f" }}s). This indicates a systemic scoring issue.
            Check: data ingestion rate, feature engineering pipeline, model inference latency.
          runbook_url: "https://github.com/Ledger-Lenz/Ledgerlens-data/docs/monitoring.md#runbook-scoring-latency"

      # Fires when recall on confirmed wash trades drops below 85%.
      # Recall = (detected wash trades) / (detected + missed wash trades).
      # SLO target: >= 85% (fraud investigation baseline; higher recall prevents missing cases).
      - alert: WashTradeRecallBelowSLO
        expr: |
          (
            sum(increase(ledgerlens_confirmed_wash_trades_total[24h]))
            /
            (
              sum(increase(ledgerlens_confirmed_wash_trades_total[24h]))
              + sum(increase(ledgerlens_false_negative_wash_trades_total[24h]))
              + 0.0001
            )
          ) < 0.85
        for: 1h
        labels:
          severity: warning
          slo: "recall"
        annotations:
          summary: "Wash trade detection recall below SLO ({{ $value | humanizePercentage }})"
          description: >
            Recall on manually-confirmed wash trades has dropped below 85% over the last 24h
            (current: {{ $value | humanizePercentage }}). This indicates the ML models may need
            retraining on recent wash trading patterns.
          runbook_url: "https://github.com/Ledger-Lenz/Ledgerlens-data/docs/monitoring.md#runbook-recall"

      # Fires when false positive rate on clean wallets exceeds 5%.
      # False positive rate = (flagged clean wallets) / (total confirmed clean wallets).
      # SLO target: < 5% (keeps false-positive burden manageable for analysts).
      - alert: WashTradeFalsePositiveRateHigh
        expr: |
          (
            sum(increase(ledgerlens_false_positive_wallets_total[24h]))
            /
            (
              sum(increase(ledgerlens_confirmed_clean_wallets_total[24h]))
              + 0.0001
            )
          ) > 0.05
        for: 1h
        labels:
          severity: warning
          slo: "false_positive_rate"
        annotations:
          summary: "False positive rate on clean wallets exceeds SLO ({{ $value | humanizePercentage }})"
          description: >
            False positive rate has exceeded 5% over the last 24h (current: {{ $value | humanizePercentage }}).
            This indicates the ML models are flagging legitimate traders too aggressively.
            Consider: lowering RISK_SCORE_FLAG_THRESHOLD, retraining with balanced examples.
          runbook_url: "https://github.com/Ledger-Lenz/Ledgerlens-data/docs/monitoring.md#runbook-false-positive"

      # Fires when Benford computation throughput is near zero.
      # Indicates either no trades are flowing or the feature pipeline is blocked.
      - alert: BenfordThroughputCritical
        expr: |
          sum(rate(ledgerlens_benford_computation_total[5m])) < 0.1
        for: 15m
        labels:
          severity: critical
          slo: "throughput"
        annotations:
          summary: "Benford computation throughput critically low (< 0.1 ops/s)"
          description: >
            Benford computation throughput has been below 0.1 operations per second for 15 minutes.
            This indicates either: (1) no trades are arriving from Stellar Horizon, or
            (2) the feature engineering pipeline is blocked/crashed.
            Check: Horizon API connectivity, streaming pipeline status, Prometheus scrape logs.
          runbook_url: "https://github.com/Ledger-Lenz/Ledgerlens-data/docs/monitoring.md#runbook-throughput"

  - name: ledgerlens_model_governance
    interval: 5m
    rules:
      # Grand 2 (issue #671, Task F): CovarianceShiftDetector.detect() had no
      # failure handling — a silently-broken drift monitor (e.g. an unhandled
      # exception on every call) would never surface. This is a DISTINCT
      # alert from PairHealthScoreLow/BenfordThroughputCritical above: those
      # detect degraded *scoring*, this detects that drift *monitoring
      # itself* has stopped running or has been failing, which those cannot
      # observe.
      - alert: DriftMonitorHeartbeatStale
        expr: |
          ledgerlens_drift_monitor_stale == 1
          or
          (time() - ledgerlens_drift_monitor_last_success_unixtime) > 3600
        for: 5m
        labels:
          severity: critical
          slo: "model_governance"
        annotations:
          summary: "Drift-check failed: CovarianceShiftDetector heartbeat is stale"
          description: >
            No successful CovarianceShiftDetector.detect() call has been recorded
            within DRIFT_MONITOR_HEARTBEAT_MAX_AGE_SECONDS (default 3600s). Either the
            monitor process has stopped running the periodic check, or every recent
            call has raised an exception (see ledgerlens_drift_monitor_check_failures_total).
            Treat feature-drift monitoring as DOWN until resolved — retraining triggers
            depending on drift detection will not fire.
          runbook_url: "https://github.com/Ledger-Lenz/Ledgerlens-data/docs/model_rollback_runbook.md#drift-monitor-health"

      # Grand 2: every promotion/rollback attempt is authorized and audited.
      # A burst of denied attempts in a short window is a signal of either a
      # misconfigured automation actor (credential drift after a secret
      # rotation) or an active unauthorized-access attempt.
      - alert: ModelPromotionUnauthorizedAttempts
        expr: |
          sum(increase(ledgerlens_promotion_denied_total[15m])) > 3
        for: 1m
        labels:
          severity: warning
          slo: "model_governance"
        annotations:
          summary: "Multiple denied model promotion/rollback attempts in 15m"
          description: >
            More than 3 promotion/rollback attempts were denied (unauthorized actor,
            regression gate, or trust-chain failure) in the last 15 minutes. Check the
            promotion_audit_log table for the actor and reason.
          runbook_url: "https://github.com/Ledger-Lenz/Ledgerlens-data/docs/model_rollback_runbook.md#authorization-failures"

  # ---------------------------------------------------------------------------
  # Per-stage latency SLO burn (Issue #921)
  #
  # Each stage has its own latency budget (monitoring/latency_budget.py,
  # docs/latency_slos.md); budgets sum to the 10s p99 end-to-end detection
  # target. Burn rate is computed per stage against that stage's own budget,
  # so a slow stage alerts on its own series without blaming its neighbours.
  # Multi-window (1h / 5m) burn-rate alerting per the Google SRE workbook.
  # In-process alerts from LatencyBudgetTracker are routed via alerts/router.py
  # (rule: latency-slo-burn-oncall).
  # ---------------------------------------------------------------------------
  - name: ledgerlens_stage_latency_slo
    rules:
      - record: ledgerlens:stage_latency_slo_burn_rate:1h
        expr: |
          sum by (stage) (rate(ledgerlens_stage_latency_budget_breaches_total[1h]))
            / clamp_min(sum by (stage) (rate(ledgerlens_stage_latency_seconds_count[1h])), 1e-9)
            / 0.01
      - record: ledgerlens:stage_latency_slo_burn_rate:5m
        expr: |
          sum by (stage) (rate(ledgerlens_stage_latency_budget_breaches_total[5m]))
            / clamp_min(sum by (stage) (rate(ledgerlens_stage_latency_seconds_count[5m])), 1e-9)
            / 0.01

      - alert: StageLatencySLOBurnCritical
        expr: |
          ledgerlens:stage_latency_slo_burn_rate:1h > 14.4
            and ledgerlens:stage_latency_slo_burn_rate:5m > 14.4
        for: 2m
        labels:
          severity: critical
          slo: "detection_latency"
        annotations:
          summary: "Stage {{ $labels.stage }} is burning its latency SLO budget fast"
          description: >
            Stage {{ $labels.stage }} is exceeding its latency budget at
            {{ $value | printf "%.1f" }}x the sustainable rate, threatening the 10s
            end-to-end detection latency SLO.
          runbook_url: "https://github.com/Ledger-Lenz/Ledgerlens-data/docs/latency_slos.md#responding-to-an-slo-burn-alert"

      - alert: StageLatencySLOBurnWarning
        expr: |
          ledgerlens:stage_latency_slo_burn_rate:1h > 2
            and ledgerlens:stage_latency_slo_burn_rate:5m > 2
        for: 15m
        labels:
          severity: warning
          slo: "detection_latency"
        annotations:
          summary: "Stage {{ $labels.stage }} latency SLO burn rate elevated"
          description: >
            Stage {{ $labels.stage }} is consuming its latency error budget at
            {{ $value | printf "%.1f" }}x the sustainable rate.
          runbook_url: "https://github.com/Ledger-Lenz/Ledgerlens-data/docs/latency_slos.md#responding-to-an-slo-burn-alert"
