repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml

  - repo: local
    hooks:
      - id: validate-dependency-lock
        name: validate dependency lock
        entry: python scripts/validate_lockfiles.py
        language: system
        pass_filenames: false
        files: ^(requirements\.in|requirements/requirements-(linux|macos)-py(311|312)\.txt|pyproject\.toml|scripts/validate_lockfiles\.py)$
